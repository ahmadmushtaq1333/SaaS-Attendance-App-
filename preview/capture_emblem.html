<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Quorum Emblem Capture</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1024px; height: 1024px; overflow: hidden; background: #000308; }
#status { position: fixed; top: 10px; left: 10px; color: #fff; font-family: monospace; z-index: 999; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="status">Initializing WebGL...</div>
<div id="canvas-container"></div>

<script>
(async function() {
  const statusEl = document.getElementById('status');
  function log(msg) { statusEl.innerText = msg; console.log(msg); }

  const SIZE = 1024;
  const container = document.getElementById('canvas-container');

  const rdr = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  rdr.setSize(SIZE, SIZE);
  rdr.setPixelRatio(1);
  container.appendChild(rdr.domElement);

  // Reusable Phong Material matching intro
  const phongMat = new THREE.MeshPhongMaterial({
    color:    new THREE.Color(0x1a44dd),
    specular: new THREE.Color(0xaaccff),
    shininess: 200,
    emissive:  new THREE.Color(0x04102e),
    emissiveIntensity: 1,
  });

  // Pure White Material for Monochrome icon
  const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  function createQGeometry(material) {
    const g = new THREE.Group();
    const bevel = { bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 16 };

    // Ring (O)
    const ring = new THREE.Shape();
    ring.absarc(0, 0, 1.0, 0, Math.PI * 2, false);
    const hole = new THREE.Path();
    hole.absarc(0, 0, 0.63, 0, Math.PI * 2, true);
    ring.holes.push(hole);

    const rMesh = new THREE.Mesh(
      new THREE.ExtrudeGeometry(ring, { ...bevel, depth: 0.3, curveSegments: 96 }),
      material
    );
    rMesh.position.z = -0.15;
    g.add(rMesh);

    // Tail
    const tail = new THREE.Shape();
    tail.moveTo(0.26, -0.46);
    tail.lineTo(0.51, -0.46);
    tail.lineTo(0.88, -1.26);
    tail.lineTo(0.62, -1.26);
    tail.closePath();

    const tMesh = new THREE.Mesh(
      new THREE.ExtrudeGeometry(tail, { ...bevel, depth: 0.3, bevelThickness: 0.04, bevelSize: 0.04, curveSegments: 32 }),
      material
    );
    tMesh.position.z = -0.15;
    g.add(tMesh);

    g.position.y = 0.1;
    return g;
  }

  // Create Glow Sprite
  function createGlowSprite(opacity) {
    const gc = document.createElement('canvas');
    gc.width = gc.height = 512;
    const gx = gc.getContext('2d');
    const grd = gx.createRadialGradient(256, 256, 0, 256, 256, 256);
    grd.addColorStop(0, 'rgba(80, 120, 255, 0.85)');
    grd.addColorStop(0.42, 'rgba(50, 90, 255, 0.28)');
    grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
    gx.fillStyle = grd;
    gx.fillRect(0, 0, 512, 512);

    const glowMat = new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(gc),
      transparent: true,
      opacity: opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const glow = new THREE.Sprite(glowMat);
    glow.scale.setScalar(5.5);
    glow.position.z = -0.4;
    return glow;
  }

  async function postAsset(name, dataUrl) {
    log('Posting ' + name + '...');
    const res = await fetch('/api/save_icon', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, data: dataUrl })
    });
    const json = await res.json();
    log('Saved ' + name + ' (' + json.size + ' bytes)');
  }

  // =========================================================================
  // 1. Full Heroic Icon (icon.png & splash-icon.png)
  // =========================================================================
  log('Rendering Full Icon...');
  {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000308);

    const cam = new THREE.PerspectiveCamera(54, 1, 0.1, 100);
    cam.position.set(0, 0, 6.2);

    const Q = createQGeometry(phongMat);
    Q.rotation.y = 0.16;
    scene.add(Q);

    scene.add(new THREE.AmbientLight(0x0a1040, 0.7));
    const kL = new THREE.PointLight(0x88aaff, 9.5, 25); kL.position.set(4, 5, 5);
    const fL = new THREE.PointLight(0x3355ff, 3.5, 20); fL.position.set(-4, 1, 3);
    const rL = new THREE.PointLight(0xaa33ff, 5.0, 20); rL.position.set(1, -4, -2);
    const tL = new THREE.PointLight(0xffffff, 5.0, 20); tL.position.set(0, 7, 4);
    [kL, fL, rL, tL].forEach(l => scene.add(l));

    scene.add(createGlowSprite(0.65));

    cam.lookAt(0, 0, 0);
    rdr.render(scene, cam);

    const dataUrl = rdr.domElement.toDataURL('image/png');
    await postAsset('icon.png', dataUrl);
    await postAsset('splash-icon.png', dataUrl);
  }

  // =========================================================================
  // 2. Android Adaptive Icon Foreground (Transparent background, safe-zone scaled)
  // =========================================================================
  log('Rendering Adaptive Foreground...');
  {
    const scene = new THREE.Scene();
    scene.background = null; // Transparent!

    const cam = new THREE.PerspectiveCamera(54, 1, 0.1, 100);
    cam.position.set(0, 0, 6.2);

    const Q = createQGeometry(phongMat);
    // Scaled by 0.72 so the entire Q and its shadow stay inside the 66% Android circle mask
    Q.scale.setScalar(0.72);
    Q.position.y = 0.08;
    Q.rotation.y = 0.16;
    scene.add(Q);

    scene.add(new THREE.AmbientLight(0x0a1040, 0.7));
    const kL = new THREE.PointLight(0x88aaff, 9.5, 25); kL.position.set(4, 5, 5);
    const fL = new THREE.PointLight(0x3355ff, 3.5, 20); fL.position.set(-4, 1, 3);
    const rL = new THREE.PointLight(0xaa33ff, 5.0, 20); rL.position.set(1, -4, -2);
    const tL = new THREE.PointLight(0xffffff, 5.0, 20); tL.position.set(0, 7, 4);
    [kL, fL, rL, tL].forEach(l => scene.add(l));

    // Subtle localized glow around Q
    const glow = createGlowSprite(0.45);
    glow.scale.setScalar(4.0);
    scene.add(glow);

    cam.lookAt(0, 0, 0);
    rdr.render(scene, cam);

    const dataUrl = rdr.domElement.toDataURL('image/png');
    await postAsset('android-icon-foreground.png', dataUrl);
  }

  // =========================================================================
  // 3. Android Adaptive Icon Background (#000308 + sapphire center aura)
  // =========================================================================
  log('Rendering Adaptive Background...');
  {
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = bgCanvas.height = SIZE;
    const ctx = bgCanvas.getContext('2d');
    ctx.fillStyle = '#000308';
    ctx.fillRect(0, 0, SIZE, SIZE);

    const grd = ctx.createRadialGradient(SIZE / 2, SIZE / 2, 0, SIZE / 2, SIZE / 2, SIZE * 0.45);
    grd.addColorStop(0, 'rgba(40, 80, 220, 0.35)');
    grd.addColorStop(0.5, 'rgba(20, 45, 150, 0.12)');
    grd.addColorStop(1, 'rgba(0, 3, 8, 0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, SIZE, SIZE);

    const dataUrl = bgCanvas.toDataURL('image/png');
    await postAsset('android-icon-background.png', dataUrl);
  }

  // =========================================================================
  // 4. Android Themed Monochrome Icon (Pure white silhouette, transparent)
  // =========================================================================
  log('Rendering Monochrome Icon...');
  {
    const scene = new THREE.Scene();
    scene.background = null;

    const cam = new THREE.PerspectiveCamera(54, 1, 0.1, 100);
    cam.position.set(0, 0, 6.2);

    const Q = createQGeometry(whiteMat);
    Q.scale.setScalar(0.72);
    Q.position.y = 0.08;
    Q.rotation.y = 0.16;
    scene.add(Q);

    cam.lookAt(0, 0, 0);
    rdr.render(scene, cam);

    const dataUrl = rdr.domElement.toDataURL('image/png');
    await postAsset('android-icon-monochrome.png', dataUrl);
  }

  log('ALL ASSETS CAPTURED SUCCESSFULLY!');
  statusEl.id = 'DONE';
})();
</script>
</body>
</html>
