<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quorum</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#060c1a;
  --accent:#4f7dfc;
  --text:#e8eaf6;
  --muted:rgba(232,234,246,.5);
  --border:rgba(255,255,255,.1);
  --card:rgba(255,255,255,.055);
}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

/* ── Intro ───────────────────────────────── */
#intro{position:fixed;inset:0;background:#000;z-index:100}
#intro canvas{display:block}

#q-label{
  position:fixed;width:100%;text-align:center;
  bottom:24%;
  font-size:clamp(.85rem,3.5vw,1.6rem);
  font-weight:200;letter-spacing:.55em;padding-left:.55em;
  color:transparent;pointer-events:none;z-index:102;
  text-shadow:0 0 40px rgba(100,150,255,.6);
}

#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:200}

/* ── Login ───────────────────────────────── */
#login{
  position:fixed;inset:0;opacity:0;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity 1.1s ease;z-index:1
}
#login.on{opacity:1;pointer-events:auto}

.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.18}
.orb-a{width:380px;height:380px;background:var(--accent);top:-120px;left:-120px}
.orb-b{width:280px;height:280px;background:#7c3aed;bottom:-80px;right:-80px}

.card{
  position:relative;
  background:var(--card);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid var(--border);border-radius:22px;
  padding:48px 40px;width:380px;max-width:calc(100vw - 32px)
}

.logo-box{
  width:52px;height:52px;background:var(--accent);
  border-radius:14px;display:grid;place-items:center;margin:0 auto 20px
}
h1{font-size:1.8rem;font-weight:700;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:.88rem;margin:6px 0 32px}

.lbl{
  font-size:.8rem;font-weight:600;color:var(--muted);
  margin-bottom:8px;display:flex;align-items:center;gap:6px
}
.f{position:relative;margin-bottom:20px}

input{
  width:100%;background:rgba(255,255,255,.05);
  border:1px solid var(--border);border-radius:12px;
  padding:13px 16px;color:var(--text);font-size:.9rem;
  outline:none;transition:border-color .2s
}
input:focus{border-color:var(--accent)}
input::placeholder{color:rgba(255,255,255,.22)}

.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.forgot{font-size:.8rem;color:var(--accent);text-decoration:none}

.eye{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--muted);padding:0
}
.btn{
  width:100%;background:var(--accent);color:#fff;border:none;
  border-radius:12px;padding:14px;font-size:.95rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:8px;margin-top:6px;transition:background .2s,transform .1s
}
.btn:hover{background:#6b93fd}
.btn:active{transform:scale(.98)}

.secure{
  text-align:center;font-size:.76rem;color:var(--muted);
  margin-top:24px;display:flex;align-items:center;
  justify-content:center;gap:5px
}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro"></div>
<div id="q-label">QUORUM</div>
<div id="flash"></div>

<!-- LOGIN -->
<div id="login">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="card">
    <div class="logo-box">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </div>
    <h1>Quorum</h1>
    <p class="sub">Sign in to your institute portal</p>

    <div class="lbl">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="#4f7dfc" stroke-width="2" stroke-linecap="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
      Email or Registration No.
    </div>
    <div class="f">
      <input type="text" placeholder="Email or Registration No. (e.g. 24pwswe0018)">
    </div>

    <div class="row">
      <div class="lbl" style="margin:0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="#4f7dfc" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Password
      </div>
      <a href="#" class="forgot">Forgot Password?</a>
    </div>
    <div class="f" style="margin-bottom:8px">
      <input type="password" id="pwd" placeholder="••••••••••••">
      <button class="eye"
        onclick="const p=document.getElementById('pwd');p.type=p.type==='password'?'text':'password'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <button class="btn">
      Sign In
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="#fff" stroke-width="2.5" stroke-linecap="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>

    <div class="secure">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Secure &amp; Encrypted Connection
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Utils ─────────────────────────────────────────────────────────────
const eO  = t => 1 - Math.pow(1 - t, 3);       // ease-out cubic
const eI  = t => t * t;                          // ease-in quad
const cl  = (v,a,b) => Math.max(a, Math.min(b,v));
const lp  = (a,b,t) => a + (b - a) * t;

const $intro = document.getElementById('intro');
const $flash = document.getElementById('flash');
const $label = document.getElementById('q-label');
const $login = document.getElementById('login');

// ── Renderer / Scene / Camera ─────────────────────────────────────────
const W = innerWidth, H = innerHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000308);
scene.fog = new THREE.FogExp2(0x000308, 0.065);

const cam = new THREE.PerspectiveCamera(54, W/H, 0.1, 100);
cam.position.set(0, 0, 7.5);

const rdr = new THREE.WebGLRenderer({ antialias: true });
rdr.setSize(W, H);
rdr.setPixelRatio(Math.min(devicePixelRatio, 2));
$intro.appendChild(rdr.domElement);

// ── Q Material — Phong for dramatic specular without env map ──────────
const mat = new THREE.MeshPhongMaterial({
  color:    new THREE.Color(0x1a44dd),
  specular: new THREE.Color(0xaaccff),
  shininess: 200,
  emissive:  new THREE.Color(0x04102e),
  emissiveIntensity: 1,
});

// ── Build extruded Q ──────────────────────────────────────────────────
function makeQ() {
  const g = new THREE.Group();
  const bevel = { bevelEnabled:true, bevelThickness:.06, bevelSize:.06, bevelSegments:10 };

  // Ring (O part) — outer circle with inner hole
  const ring = new THREE.Shape();
  ring.absarc(0, 0, 1.0,  0, Math.PI*2, false);
  const hole = new THREE.Path();
  hole.absarc(0, 0, 0.63, 0, Math.PI*2, true);
  ring.holes.push(hole);

  const rMesh = new THREE.Mesh(
    new THREE.ExtrudeGeometry(ring, { ...bevel, depth:.3, curveSegments:80 }),
    mat
  );
  rMesh.position.z = -0.15;
  g.add(rMesh);

  // Tail (diagonal slash of Q)
  const tail = new THREE.Shape();
  tail.moveTo(0.26, -0.46);
  tail.lineTo(0.51, -0.46);
  tail.lineTo(0.88, -1.26);
  tail.lineTo(0.62, -1.26);
  tail.closePath();

  const tMesh = new THREE.Mesh(
    new THREE.ExtrudeGeometry(tail, { ...bevel, depth:.3, bevelThickness:.04, bevelSize:.04, curveSegments:16 }),
    mat
  );
  tMesh.position.z = -0.15;
  g.add(tMesh);

  // Vertically center (ring top ≈ +1.06, tail bottom ≈ −1.26 → midpoint ≈ −0.1)
  g.position.y = 0.1;
  return g;
}

const Q = makeQ();
Q.scale.setScalar(0.01);   // start invisible-small
scene.add(Q);

// ── Lights ────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x0a1040, 0.6));

// Key — cool blue from upper-right
const kL = new THREE.PointLight(0x88aaff, 0, 22); kL.position.set( 4,  5,  5);
// Fill — deeper blue from left
const fL = new THREE.PointLight(0x3355ff, 0, 16); fL.position.set(-4,  1,  3);
// Rim — purple from behind/below (creates the halo edge)
const rL = new THREE.PointLight(0xaa33ff, 0, 16); rL.position.set( 1, -4, -2);
// Top — pure white top-down catch-light
const tL = new THREE.PointLight(0xffffff, 0, 14); tL.position.set( 0,  7,  4);
[kL, fL, rL, tL].forEach(l => scene.add(l));

// ── Glow sprite (additive canvas gradient behind Q) ───────────────────
const gc  = document.createElement('canvas');
gc.width  = gc.height = 256;
const gx  = gc.getContext('2d');
const grd = gx.createRadialGradient(128,128,0, 128,128,128);
grd.addColorStop(0,   'rgba(80,120,255,.85)');
grd.addColorStop(.42, 'rgba(50,90,255,.28)');
grd.addColorStop(1,   'rgba(0,0,0,0)');
gx.fillStyle = grd; gx.fillRect(0,0,256,256);

const glowMat = new THREE.SpriteMaterial({
  map: new THREE.CanvasTexture(gc),
  transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const glow = new THREE.Sprite(glowMat);
glow.scale.setScalar(5);
glow.position.z = -0.4;
scene.add(glow);

// ── Particles — orbiting field of blue dust ───────────────────────────
const PC   = 750;
const pPos = new Float32Array(PC * 3);
for (let i = 0; i < PC; i++) {
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  const r  = 2.2 + Math.random() * 2.8;
  pPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
  pPos[i*3+1] = r * Math.sin(ph) * Math.sin(th) * 0.62;
  pPos[i*3+2] = r * Math.cos(ph);
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({
  color: 0x5599ff, size: .025, transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const pts = new THREE.Points(pGeo, pMat);
scene.add(pts);

// ── Skip on tap/click ─────────────────────────────────────────────────
$intro.addEventListener('click', skipToLogin);

// ── Animation loop ────────────────────────────────────────────────────
const TOTAL = 5.3;
let t0 = null, over = false;

function tick(ts) {
  if (over) return;
  if (!t0) t0 = ts;
  const e = (ts - t0) / 1000;   // seconds elapsed

  // ── Phase 1 (0–1.1s): Q bursts in from below, lights fire on ──────
  if (e < 1.1) {
    const t = eO(e / 1.1);
    Q.scale.setScalar(lp(0.01, 1, t));
    Q.rotation.y   = lp(-Math.PI * .78, 0, t);
    Q.position.y   = lp(-1.8, 0.1, t);
    cam.position.z = lp(9.5, 6.2, t);
    cam.position.y = lp(-.7, 0, t);
    kL.intensity = lp(0, 9,   t);
    tL.intensity = lp(0, 4.5, t);
    fL.intensity = lp(0, 3,   t);
    glowMat.opacity = lp(0, 0.65, t);
  }

  // ── Phase 2 (1.1–3.4s): slow orbit, rim ignites, particles bloom ──
  else if (e < 3.4) {
    const t  = (e - 1.1) / 2.3;
    Q.rotation.y     = lp(0, Math.PI * .38, t * .5);
    rL.intensity     = lp(0, 7, cl(t * 3, 0, 1));
    pMat.opacity     = lp(0, .82, cl(t * 2.5, 0, 1));
    pts.rotation.y   = e * 0.13;
    cam.position.y   = Math.sin(e * .65) * 0.09;
    // Gentle specular pulse
    kL.intensity     = 9 + Math.sin(e * 2.3) * 1.4;
    glowMat.opacity  = .52 + Math.sin(e * 2.9) * .13;
    // QUORUM text fades in after 0.2×through phase
    const lt = cl((t - .18) / .55, 0, 1);
    $label.style.color = `rgba(160,195,255,${lt * .9})`;
  }

  // ── Phase 3 (3.4–4.5s): Q surges at camera, flash builds ─────────
  else if (e < 4.5) {
    const t = eI((e - 3.4) / 1.1);
    Q.position.z    = lp(0, 6, t);
    Q.scale.setScalar(lp(1, 2.4, t));
    Q.rotation.y   += 0.022;
    pts.rotation.y += 0.014;
    $flash.style.opacity = String(cl(t * 1.1, 0, 1));
    $label.style.color   = `rgba(160,195,255,${lp(.9, 0, t)})`;
    glowMat.opacity      = lp(.54, 0, t);
  }

  // ── Phase 4 (4.5–5.3s): pure white hold ───────────────────────────
  else if (e < TOTAL) {
    $flash.style.opacity = '1';
  }

  // ── Done: fade flash, reveal login ────────────────────────────────
  else {
    skipToLogin();
    return;
  }

  cam.lookAt(0, 0, 0);
  rdr.render(scene, cam);
  requestAnimationFrame(tick);
}

function skipToLogin() {
  if (over) return;
  over = true;
  $flash.style.transition = 'opacity 1s ease';
  requestAnimationFrame(() => { $flash.style.opacity = '0'; });
  $login.classList.add('on');
  setTimeout(() => { $intro.style.display = 'none'; }, 1200);
}

requestAnimationFrame(tick);

window.addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  rdr.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
