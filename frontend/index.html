<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/quorum.svg" />
    <link rel="apple-touch-icon" href="/quorum.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quorum - Management System</title>

  <body>
    <script>
      // Prevent flash of dark mode: apply theme class before React renders
      if (localStorage.getItem("theme") !== "dark") {
        document.documentElement.classList.add("light-mode");
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
