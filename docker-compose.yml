services:
  db:
    image: mysql:8.0
    container_name: attendance_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: attendance_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: attendance_django_backend
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 attendance_saas.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=prod-secret-key-123456
      - DJANGO_SETTINGS_MODULE=attendance_saas.settings.prod
      - DB_NAME=attendance_db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=*
    depends_on:
      - db
      - redis

  celery_worker:
    build: ./backend
    container_name: attendance_celery_worker
    restart: always
    command: celery -A attendance_saas worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - SECRET_KEY=prod-secret-key-123456
      - DJANGO_SETTINGS_MODULE=attendance_saas.settings.prod
      - DB_NAME=attendance_db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: attendance_react_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
